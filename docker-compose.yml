version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vikinges-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vikinges}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vikinges_secret}
      POSTGRES_DB: ${POSTGRES_DB:-barbearia_vikinges}

      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vikinges}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
